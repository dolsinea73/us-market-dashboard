<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>미국 증시 심리 대시보드</title><style>body{margin:0;background:#0b1220;color:#e5edf8;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1050px;margin:auto;padding:22px}h1{font-size:26px}p,small{color:#9caec7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#172238;border:1px solid #293a55;border-radius:16px;padding:20px}.label{color:#aabbd2}.value{font-size:32px;font-weight:750;margin:12px 0}.detail{font-size:13px;color:#b8c7dc}a{color:#87baff}button{background:#3679ed;color:white;border:0;border-radius:10px;padding:10px 14px;font-size:15px}footer{margin-top:25px;line-height:1.7}</style></head><body><main><h1>🇺🇸 미국 증시 심리 대시보드</h1><p>미국 증시 주요 지표 · 무료 일간 데이터 · 자동 업데이트</p><p id="stamp">데이터 불러오는 중…</p><button onclick="load()">새로고침</button><div class="grid" id="grid"></div><footer><small>가격 및 기술지표: Yahoo Finance의 일별 시장 데이터(yfinance 경유). 공포·탐욕지수: CNN 공개 지표(접근 가능한 경우). 데이터는 지연될 수 있으며 투자 판단의 유일한 근거로 사용하지 마세요. EMA20·RSI14·MACD 오실레이터는 나스닥 종합지수 일별 종가로 계산합니다. GitHub Actions가 하루 여러 차례 데이터를 수집하며 페이지는 15분마다 다시 읽습니다.</small></footer></main><script>const items=[['fear_greed','CNN Fear & Greed'],['nasdaq','나스닥 종합지수'],['ema20','나스닥 EMA20'],['oscillator','MACD 오실레이터'],['vix','VIX 변동성지수'],['sp500','S&P 500'],['rsi14','나스닥 RSI(14)'],['us10y','미국 10년물 금리']];async function load(){try{let r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('데이터 파일 없음');let d=await r.json();document.getElementById('stamp').textContent='최종 업데이트(한국시간): '+(d.updated_kst||'확인 불가');document.getElementById('grid').innerHTML=items.map(([k,n])=>{let x=d.metrics?.[k]||{};return `<div class="card"><div class="label">${n}</div><div class="value">${x.value??'데이터 없음'}</div><div class="detail">${x.note||'수집 대기 중'}</div></div>`}).join('')}catch(e){document.getElementById('stamp').textContent='아직 데이터가 생성되지 않았습니다. Actions 실행 상태를 확인하세요.';document.getElementById('grid').innerHTML=items.map(([k,n])=>`<div class="card"><div class="label">${n}</div><div class="value">—</div></div>`).join('')}}load();setInterval(load,900000)</script></body></html>
